<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Static IP Test - Render Deployment</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
            text-align: center;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .info-card {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            transition: transform 0.2s;
        }

        .info-card:hover {
            transform: translateX(5px);
        }

        .info-label {
            color: #667eea;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .info-value {
            color: #333;
            font-size: 18px;
            font-weight: 500;
            word-break: break-all;
            font-family: 'Courier New', monospace;
        }

        .status {
            text-align: center;
            margin-top: 30px;
            padding: 15px;
            background: #d4edda;
            border: 1px solid #c3e6cb;
            border-radius: 8px;
            color: #155724;
        }

        .refresh-btn {
            display: block;
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .refresh-btn:hover {
            background: #5568d3;
        }

        .timestamp {
            text-align: center;
            color: #999;
            font-size: 12px;
            margin-top: 20px;
        }

        .nav-btn {
            display: block;
            width: 100%;
            margin-top: 15px;
            padding: 15px;
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            text-align: center;
        }

        .nav-btn:hover {
            background: #667eea;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Static IP Test</h1>
        <p class="subtitle">Render Deployment Verification</p>

        <div class="info-card">
            <div class="info-label">Server Public IP</div>
            <div class="info-value">{{ public_ip }}</div>
        </div>

        <div class="info-card">
            <div class="info-label">Server Local IP</div>
            <div class="info-value">{{ local_ip }}</div>
        </div>

        <div class="info-card">
            <div class="info-label">Server Hostname</div>
            <div class="info-value">{{ hostname }}</div>
        </div>

        <div class="info-card">
            <div class="info-label">Your IP Address</div>
            <div class="info-value">{{ client_ip }}</div>
        </div>

        <div class="status">
            ✓ Flask Application Running Successfully
        </div>

        <button class="refresh-btn" onclick="location.reload()">Refresh Information</button>

        <a href="/ping" class="nav-btn">🔍 PING Test Tool</a>

        <p class="timestamp">Last updated: <span id="timestamp"></span></p>
    </div>

    <script>
        document.getElementById('timestamp').textContent = new Date().toLocaleString();
    </script>
</body>
</html>
